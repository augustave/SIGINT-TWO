name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Regenerate SVG patterns
        run: python3 scripts/build_patterns.py

      - name: Verify generated patterns are committed
        run: |
          if ! git diff --exit-code -- sigint_terrain_bundle/patterns/; then
            echo "::error::Generated SVGs differ from committed copy. Run scripts/build_patterns.py and commit the result."
            exit 1
          fi

      - name: Run conformance validator
        run: python3 scripts/validate.py
